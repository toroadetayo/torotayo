backend:
  name: github
  repo: torotayo/torotayo  # ← UPDATE: your GitHub username/repo
  branch: main
  base_url: https://YOUR_VERCEL_DOMAIN.vercel.app  # ← UPDATE: your Vercel production URL
  auth_endpoint: api/auth

media_folder: public
public_folder: /

publish_mode: editorial_workflow

collections:

  # ── SITE SETTINGS ─────────────────────────────────────────────────────────
  - name: site_settings
    label: "Site Settings"
    files:
      - name: settings
        label: "Global Settings (Hero, Nav, Footer, Social Links)"
        file: src/data/site-settings.json
        fields:
          - { label: "Site Title (browser tab)", name: site_title, widget: string }
          - { label: "Nav Brand Name", name: nav_brand, widget: string }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: Email Address, name: email, widget: string }
          - label: Hero Section
            name: hero
            widget: object
            fields:
              - { label: Headline, name: headline, widget: text }
              - { label: Subtitle, name: subtitle, widget: text }
              - { label: "Learn More Button Label", name: cta_learn_more, widget: string }
              - { label: "Contact Button Label", name: cta_contact, widget: string }
              - { label: Hero Image, name: image, widget: image }
              - { label: Hero Image Alt Text, name: image_alt, widget: string }
          - label: Projects Section
            name: projects_section
            widget: object
            fields:
              - { label: Section Heading, name: heading, widget: string }
              - { label: Section Description, name: description, widget: text }
              - label: Filter Pills
                name: filters
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value (lowercase, no spaces), name: value, widget: string }
          - label: Writing Section
            name: writing_section
            widget: object
            fields:
              - { label: Section Heading, name: heading, widget: string }
              - { label: Section Description, name: description, widget: text }
              - { label: Muckrack Profile URL, name: muckrack_url, widget: string }
              - { label: Susinsight URL, name: susinsight_url, widget: string }
              - { label: Susbridge URL, name: susbridge_url, widget: string }
              - { label: Medium URL, name: medium_url, widget: string }
              - label: Filter Pills
                name: filters
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value (lowercase, no spaces), name: value, widget: string }
          - label: Speaking Section
            name: speaking_section
            widget: object
            fields:
              - { label: Section Heading, name: heading, widget: string }
              - { label: Topics Intro Text, name: topics_intro, widget: string }
              - { label: Engagements Sub-heading, name: engagements_heading, widget: string }
              - { label: "Invite to Speak Button Label", name: cta_email, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Body Text, name: body, widget: text }
              - label: Social Links
                name: social_links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Open in new tab, name: external, widget: boolean, default: true }

  # ── INFO / ABOUT DRAWER ───────────────────────────────────────────────────
  - name: info
    label: "Info / About"
    files:
      - name: info
        label: "Info Drawer Content"
        file: src/data/info.json
        fields:
          - { label: Lead Sentence, name: lead, widget: text }
          - label: Body Paragraphs
            name: paragraphs
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: "\"What Drives This Work\" Heading", name: drives_heading, widget: string }
          - { label: "\"What Drives This Work\" Body (supports [link](url) syntax)", name: drives_body, widget: text }
          - { label: "\"Beyond the Work\" Heading", name: beyond_heading, widget: string }
          - { label: "\"Beyond the Work\" Body (supports [link](url) syntax)", name: beyond_body, widget: text }
          - { label: Affiliations Heading, name: affiliations_heading, widget: string }
          - label: Affiliations List
            name: affiliations
            widget: list
            field: { label: Affiliation, name: item, widget: string }

  # ── PROJECTS ──────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    files:
      - name: projects
        label: "All Projects (cards + drawer content)"
        file: src/data/projects.json
        fields:
          - label: Projects
            name: projects
            widget: list
            label_singular: Project
            fields:
              - { label: "ID / Slug (no spaces, e.g. culerson)", name: id, widget: string }
              - label: Category
                name: category
                widget: select
                options:
                  - { label: Advisory, value: advisory }
                  - { label: Communications, value: communications }
                  - { label: Research, value: research }
              - { label: Card Tag Label, name: tag, widget: string }
              - { label: Card Title, name: title, widget: string }
              - { label: Card Short Description, name: description, widget: text }
              - { label: Card Image, name: image, widget: image }
              - label: Link Type
                name: link_type
                widget: select
                options:
                  - { label: "Opens drawer (internal detail)", value: drawer }
                  - { label: "External URL", value: external }
              - label: External URL
                name: url
                widget: string
                required: false
                hint: "Only for External URL type"
              - label: Drawer ID
                name: drawer_id
                widget: string
                required: false
                hint: "Only for drawer type. Convention: [id]-drawer e.g. culerson-drawer"
              - label: Drawer Content
                name: drawer
                widget: object
                required: false
                fields:
                  - { label: Drawer Subtitle, name: subtitle, widget: text }
                  - label: Meta Fields (e.g. Role, Year, Institution)
                    name: meta
                    widget: list
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Value, name: value, widget: string }
                  - label: "Visit Link URL (optional — shows a Visit button at top)"
                    name: visit_link
                    widget: string
                    required: false
                  - label: "Body Content (Markdown: ## headings, **bold**, - lists, 1. numbered lists, [text](url) links)"
                    name: body
                    widget: markdown
                  - label: "Resource Box (optional — highlighted link box)"
                    name: resource
                    widget: object
                    required: false
                    fields:
                      - { label: Box Heading, name: heading, widget: string }
                      - { label: Description (optional), name: description, widget: string, required: false }
                      - { label: URL, name: url, widget: string }
                      - { label: Button Label, name: button_label, widget: string }
                  - label: Skills / Tools
                    name: skills
                    widget: list
                    field: { label: Skill, name: skill, widget: string }

  # ── WRITING ───────────────────────────────────────────────────────────────
  - name: writing
    label: Writing
    files:
      - name: writing
        label: "All Writing Entries"
        file: src/data/writing.json
        fields:
          - label: Writing Entries
            name: writing
            widget: list
            label_singular: Article
            fields:
              - label: Category
                name: category
                widget: select
                options:
                  - { label: Environment, value: environment }
                  - { label: Energy, value: energy }
                  - { label: Policy, value: policy }
              - { label: Tag Label, name: tag, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Short Description, name: description, widget: text }
              - { label: Card Image, name: image, widget: image }
              - { label: Article URL, name: url, widget: string }
              - { label: Link Button Label, name: link_label, widget: string, default: "Read here" }

  # ── SPEAKING ──────────────────────────────────────────────────────────────
  - name: speaking
    label: Speaking
    files:
      - name: speaking
        label: "Speaking Content"
        file: src/data/speaking.json
        fields:
          - label: Talk Topics
            name: talk_topics
            widget: list
            field: { label: Topic, name: topic, widget: string }
          - label: Speaking Engagements
            name: engagements
            widget: list
            label_singular: Engagement
            fields:
              - { label: Date Tag (e.g. "April 2026"), name: date_tag, widget: string }
              - { label: Talk Title, name: title, widget: string }
              - { label: Host / Event Name, name: host, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image }
              - { label: Link Button Label, name: link_label, widget: string, default: "Watch Recording" }
              - { label: URL, name: url, widget: string }
