<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adetoro Adetayo | Sustainability and Impact Strategist</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Miranda+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" onerror="this.onerror=null;this.href='https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap';">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <div class="nav-brand" id="nav-brand"></div>
      <button id="mobile-menu-btn" class="hamburger" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#" id="info-btn">Info</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#writing">Writing</a></li>
        <li><a href="#speaking">Speaking</a></li>
        <li><a href="mailto:torotayo@gmail.com">Email</a></li>
        <li><button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌓</button></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <section id="home" class="hero">
      <div id="hero-mount"></div>
    </section>

    <section id="projects" class="section">
      <div id="projects-header-mount"></div>
      <div class="grid" id="projects-grid"></div>
      <div class="load-more-container" style="text-align:center;margin-top:3rem;">
        <button id="load-more-btn" class="btn secondary" style="display:none">Load More</button>
      </div>
    </section>

    <section id="writing" class="section">
      <div id="writing-header-mount"></div>
      <div class="grid" id="writing-grid"></div>
      <div class="load-more-container" style="text-align:center;margin-top:3rem;">
        <button id="load-more-writing-btn" class="btn secondary" style="display:none">Load More</button>
      </div>
    </section>

    <section id="speaking" class="section">
      <div id="speaking-mount"></div>
    </section>

    <footer>
      <div id="footer-mount"></div>
    </footer>
  </main>

  <div id="drawer-overlay" class="drawer-overlay"></div>
  <div id="drawers-mount"></div>

  <script type="module" src="/src/render.js"></script>
  <script defer src="/script.js"></script>
</body>
</html>
